# Server port
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=12345678

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize with sample data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging with trace correlation pattern
logging.level.com.sr_banking.banking_project=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Application name for OpenTelemetry
spring.application.name=banking-service

# OpenTelemetry Tracing Configuration
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# OTLP Exporter Configuration (for production use with collectors like Jaeger)
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# Actuator endpoints exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus
