spring.application.name=banking-project
server.port=8080

# --- Database (H2 in-memory for local/demo) ---
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Seed data ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- H2 console (dev only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JSON: ISO-8601 dates (ABS-MAS Playbook: use ISO 8601 for date/time) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.time-zone=UTC

# --- API security credentials (override via environment in non-demo environments) ---
app.security.user.name=${API_USER:user}
app.security.user.password=${API_USER_PASSWORD:changeit}
app.security.admin.name=${API_ADMIN:admin}
app.security.admin.password=${API_ADMIN_PASSWORD:changeit}

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator: expose health only ---
management.endpoints.web.exposure.include=health

# --- TLS (ABS-MAS Playbook: Encryption / TLS 1.2+). Enable in production with a real keystore:
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store-password=${KEYSTORE_PASSWORD}
# server.ssl.protocol=TLS
# server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# --- Logging ---
logging.level.com.sr_banking.banking_project=INFO
