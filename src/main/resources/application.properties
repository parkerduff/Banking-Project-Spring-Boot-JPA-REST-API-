# Server port
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
# Credentials are externalised; never commit real secrets (ABS A6).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# SQL logging disabled by default to avoid leaking data to logs (ABS A6).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console disabled by default; enable only in local dev via env (ABS A6).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Initialize with sample data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.com.sr_banking.banking_project=INFO
logging.level.org.hibernate.SQL=WARN
